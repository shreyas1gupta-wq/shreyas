# ============================================================================
# CANONICAL CYCLE REGISTRY
# ----------------------------------------------------------------------------
# Schema and rules: docs/model/01-cycle-taxonomy.md §10
# Theory:           docs/theory/01-CYCLE-THEORY.md
# Methods:          docs/theory/02-ECONOMETRIC-METHODS.md
# Owner decisions:  docs/model/DECISIONS.md
#
# THE LADDER KEY IS tau_half_months, NOT a claimed period. Cycles are ordered by
# the half-life of their own autocorrelation, which is estimable from
# overlapping windows even with zero complete observed cycles. Claimed periods
# are descriptive only.
#
# ENFORCED IN CI (tests/test_registry.py):
#   R1  phase_repr: circular  =>  n_obs.effective >= 4
#   R2  influence governed by min(phase_confidence, mapping_confidence)
#   R3  evidence_tier: C      =>  one_sided: true (may only REDUCE risk)
#   R4  sum of tier-C L1 allocation influence <= 150 bps NAV
#   R6  data_tier: D5         =>  status: cut, or proxy_of set
#   R7  cycle budgets are for ADDING risk; L18 may cut without limit
#   + per-bucket budget containment, 3-sigma aggregation, turnover, DAG acyclicity
#   + mvp: true => data_tier <= D4 and a committed fixture exists
#
# NEUTRAL POLICY PORTFOLIO (the zero-signal state all influence deviates from):
#   equity 60% · gold 12% · debt 28% · gross 1.00x · sector weights = benchmark
# The debt sleeve's assumed 10%/4%vol is deliberately NOT allowed to set this
# point; letting it do so is an optimizer corner-solution into the 70% cap.
# ============================================================================

meta:
  version: "0.1.0"
  last_reviewed: "2026-08-29"
  neutral_portfolio: {equity_pct: 60.0, gold_pct: 12.0, debt_pct: 28.0, gross_x: 1.00}
  min_traverse_months_by_tier: {A: 6, B: 12, C: 36}
  tier_influence_multiplier: {A: 1.00, B: 0.60, C: 0.30}
  tier_c_aggregate_cap_bps: 150
  buckets:
    B0: {name: "Secular / long wave",        tau_half_min: 96,  tau_half_max: null, rebalance: "annual review, quarterly step"}
    B1: {name: "Generational / structural",  tau_half_min: 48,  tau_half_max: 96,   rebalance: "quarterly"}
    B2: {name: "Credit and capex",           tau_half_min: 24,  tau_half_max: 60,   rebalance: "quarterly / monthly"}
    B3: {name: "Business, earnings, policy", tau_half_min: 9,   tau_half_max: 30,   rebalance: "monthly"}
    B4: {name: "Intermediate tactical",      tau_half_min: 3,   tau_half_max: 12,   rebalance: "weekly (agg) / monthly (mod)"}
    B5: {name: "Fast",                       tau_half_min: 0,   tau_half_max: 3,    rebalance: "weekly, aggressive book only"}

  # Per-bucket allocation authority, +/- pp of NAV, AFTER tier multipliers and
  # phase attenuation. Individual cycle influence must sum within these (L1).
  bucket_budgets:
    aggressive:
      B0: {equity: [5, 5],  gold: [3, 14], debt: [8, 10], sector_l1: 4,  name_l1: 0,  leverage: [-0.25, 0.00], turnover_pp: 2.5}
      B1: {equity: [5, 5],  gold: [2, 8],  debt: [6, 6],  sector_l1: 5,  name_l1: 0,  leverage: [-0.10, 0.00], turnover_pp: 3.0}
      B2: {equity: [10, 8], gold: [2, 4],  debt: [8, 10], sector_l1: 8,  name_l1: 0,  leverage: [-0.20, 0.10], turnover_pp: 8.0}
      B3: {equity: [12, 12],gold: [2, 6],  debt: [10, 10],sector_l1: 12, name_l1: 6,  leverage: [-0.15, 0.15], turnover_pp: 15.7}
      B4: {equity: [8, 8],  gold: [1.5, 4],debt: [6, 6],  sector_l1: 10, name_l1: 25, leverage: [-0.10, 0.10], turnover_pp: 18.1}
      B5: {equity: [4, 4],  gold: [1, 2],  debt: [3, 3],  sector_l1: 5,  name_l1: 40, leverage: [-0.05, 0.05], turnover_pp: 18.1}
    moderate:
      B0: {equity: [5, 5],  gold: [3, 14], debt: [8, 10], sector_l1: 3,  name_l1: 0,  leverage: [-0.25, 0.00], turnover_pp: 2.5}
      B1: {equity: [4, 4],  gold: [2, 8],  debt: [5, 5],  sector_l1: 4,  name_l1: 0,  leverage: [-0.10, 0.00], turnover_pp: 2.4}
      B2: {equity: [8, 7],  gold: [2, 4],  debt: [7, 8],  sector_l1: 6,  name_l1: 0,  leverage: [-0.20, 0.05], turnover_pp: 6.4}
      B3: {equity: [9, 9],  gold: [2, 5],  debt: [8, 8],  sector_l1: 8,  name_l1: 3,  leverage: [-0.15, 0.10], turnover_pp: 11.8}
      B4: {equity: [4, 4],  gold: [1, 3],  debt: [3, 3],  sector_l1: 5,  name_l1: 10, leverage: [-0.10, 0.05], turnover_pp: 9.1}
      B5: {equity: [0, 0],  gold: [0, 0],  debt: [0, 0],  sector_l1: 0,  name_l1: 0,  leverage: [0, 0],        turnover_pp: 0}

  # Hard mandate caps (owner-frozen, DECISIONS.md Q10/Q12/Q15).
  mandate_caps:
    equity_floor_pct: 15.0
    gold_max_pct: 50.0
    gold_insurance_floor_pct: 4.0     # L02; binds at 2.8 sigma on the downside — known and intended
    debt_max_pct: 70.0
    gross_leverage_max_x: 1.50
    gross_leverage_target_avg_x: 1.25
    name_entry_max_pct: 6.0
    name_drift_max_pct: 10.0
    min_names_when_equity_below_50pct: 10
    in_progress_positions_max_pct: 20.0
    options_notional_directional_max_pct: 50.0
    options_notional_tail_max_pct: 75.0
    # OPEN — see DECISIONS.md. The absolute form is a permanent forced underweight
    # to financials (~30-35% of Nifty 500). Relative form recommended.
    sector_cap_mode: relative          # relative | absolute
    sector_cap_absolute_pct: {aggressive: 25.0, moderate: 20.0}
    sector_cap_relative_pp: {aggressive: 10.0, moderate: 8.0}

# ============================================================================
# CYCLES
# ============================================================================
cycles:

# ---------------------------------------------------------------- B0 secular
- id: monetary_order_debasement
  name: "Monetary order / sovereign debt debasement arc"
  family: debasement
  parent_id: null
  bucket: B0
  claimed_period_years: [60, 90]
  period_dispersion_cv: null
  tau_half_months: 120
  phase_repr: ordinal              # R1: n_eff < 4, cannot be circular
  mechanism: "Sovereign debt build-up forces negative real rates or monetisation, ending in liquidation or monetary reset."
  n_obs: {timeseries: 2, cross_sectional: 8, effective: 2.0}
  evidence_tier: C
  evidence_note: "Dalio (2018, 2021); Reinhart & Rogoff (2009); ~8 financial-repression episodes. Zero India observations."
  data_tier: D1
  proxy_of: null
  indicators:
    - {code: us_debt_gdp,        definition: "US general govt debt / GDP",              source_name: IMF WEO,  freq: A, history_start: 1980, pit_status: true, lag_days: 180}
    - {code: real_policy_rate_g4,definition: "GDP-weighted G4 policy rate minus core CPI", source_name: FRED,   freq: M, history_start: 1960, pit_status: true, lag_days: 30}
    - {code: usd_reserve_share,  definition: "USD share of allocated FX reserves",       source_name: IMF COFER,freq: Q, history_start: 1999, pit_status: true, lag_days: 90}
    - {code: cb_gold_net_purch,  definition: "Central bank net gold purchases, 4q sum",  source_name: World Gold Council, freq: Q, history_start: 2000, pit_status: true, lag_days: 45}
  gain: {target: gold_pct, k_pp_per_unit: 10.0, mapping_fn: logistic, peak_phase_rad: null}
  influence:
    agg: {equity_pp: [0.5, 0], gold_pp: [0.3, 0.7], debt_pp: [0.3, 0], sector_l1_pp: 0.5, name_l1_pp: 0, leverage_x: [-0.15, 0.00]}
    mod: {equity_pp: [0.5, 0], gold_pp: [0.3, 0.7], debt_pp: [0.3, 0], sector_l1_pp: 0.5, name_l1_pp: 0, leverage_x: [-0.15, 0.00]}
  rate_limit: {max_delta_pp_per_month: 0.025, min_traverse_months: 240}
  hysteresis: {enter_z: 1.5, exit_z: 0.7, min_dwell_months: 36, smooth_window_months: 24}
  one_sided: true                  # R3 — tier C: may only REDUCE risk.
  # R4 RESOLUTION (L01 vs L02 interface conflict, recorded rather than hidden):
  #   L02 proposed gold up to ~10pp for this cycle. L01 rule R4 caps the AGGREGATE
  #   L1 allocation influence of all tier-C cycles at 150 bps of NAV. This cycle is
  #   the only active tier-C entry, so it gets the whole 150 bps and no more:
  #   0.5 + 0.7 + 0.3 = 1.5pp. L01 binds, per its own recommendation in section 8.5.
  #   The long-wave debasement view is therefore expressed almost entirely through
  #   the STRUCTURAL gold insurance floor (meta.mandate_caps.gold_insurance_floor_pct),
  #   which is a mandate backstop, NOT cycle influence — and through the tail-hedge
  #   policy in L16. That is the honest place for a 2-observation claim to live.
  triggers:
    - {event_id: sovereign_downgrade_g4,   definition: "G4 sovereign downgraded by a major agency", delta_tau_years: 2.0, sigma_inflation_rad: 0.3, refractory_years: 3}
    - {event_id: reserve_system_change,    definition: "Announced multilateral settlement/reserve arrangement displacing USD at scale", delta_tau_years: 3.0, sigma_inflation_rad: 0.5, refractory_years: 5}
    - {event_id: explicit_debt_monetisation, definition: "Central bank permanent monetisation of fiscal deficit", delta_tau_years: 2.5, sigma_inflation_rad: 0.4, refractory_years: 3}
  orthogonalization: {beta_prior: null, shrinkage_lambda: 0.8, retained_variance: 1.00}
  owner_layer: L02
  mvp: true
  status: active

- id: india_development_arc
  name: "India per-capita development S-curve"
  family: structural_india
  parent_id: null
  bucket: B0
  claimed_period_years: null
  period_dispersion_cv: null
  tau_half_months: 120
  phase_repr: state
  mechanism: "Rising per-capita income shifts consumption mix and deepens financial intermediation; monotone, not cyclic."
  n_obs: {timeseries: 1, cross_sectional: 15, effective: 8.0}
  evidence_tier: B
  evidence_note: "Cross-sectional analogues: KR, TW, JP, CN, TH, MY, BR and others through the same income band."
  data_tier: D2
  proxy_of: null
  indicators:
    - {code: india_gdp_pc_ppp,    definition: "India GDP per capita, PPP, constant",    source_name: World Bank, freq: A, history_start: 1960, pit_status: lag_approx, lag_days: 365}
    - {code: india_credit_gdp,    definition: "Private credit / GDP",                   source_name: BIS,        freq: Q, history_start: 1951, pit_status: true, lag_days: 120}
    - {code: hh_financial_share,  definition: "Household financial assets / total household assets", source_name: RBI DBIE, freq: A, history_start: 2000, pit_status: lag_approx, lag_days: 270}
  gain: {target: sector_tilt, k_pp_per_unit: 3.0, mapping_fn: linear, peak_phase_rad: null}
  influence:
    agg: {equity_pp: [2, 3], gold_pp: [1, 4], debt_pp: [3, 4], sector_l1_pp: 2, name_l1_pp: 0, leverage_x: [-0.10, 0.00]}
    mod: {equity_pp: [2, 3], gold_pp: [1, 4], debt_pp: [3, 4], sector_l1_pp: 1, name_l1_pp: 0, leverage_x: [-0.10, 0.00]}
  rate_limit: {max_delta_pp_per_month: 0.025, min_traverse_months: 240}
  hysteresis: {enter_z: 1.0, exit_z: 0.5, min_dwell_months: 24, smooth_window_months: 24}
  one_sided: false
  triggers: []
  orthogonalization: {beta_prior: null, shrinkage_lambda: 0.6, retained_variance: 1.00}
  owner_layer: L02
  mvp: true
  status: active

